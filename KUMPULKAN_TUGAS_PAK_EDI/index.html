                          <p className="text-xs font-semibold text-dusty-900">{personalInfo.contact.whatsappDisplay}</p>
                        </div>
                        <a href={personalInfo.contact.whatsappLink} target="_blank" rel="noopener noreferrer" className="px-3 py-1 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-bold hover:bg-emerald-100">
                          Chat WA
                        </a>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-white border border-dusty-200 flex items-center justify-between">
                        <div>
                          <p className="text-[10px] font-bold uppercase text-dusty-500">Instagram</p>
                          <p className="text-xs font-semibold text-dusty-900">{personalInfo.contact.instagramHandle}</p>
                        </div>
                        <a href={personalInfo.contact.instagramLink} target="_blank" rel="noopener noreferrer" className="px-3 py-1 bg-dusty-100 text-dusty-800 rounded-lg text-xs font-bold hover:bg-dusty-200">
                          Buka IG
                        </a>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-white border border-dusty-200">
                        <p className="text-[10px] font-bold uppercase text-dusty-500">Email</p>
                        <p className="text-xs font-semibold text-dusty-900">{personalInfo.contact.emailAddress}</p>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-white border border-dusty-200">
                        <p className="text-[10px] font-bold uppercase text-dusty-500">Domisili</p>
                        <p className="text-xs font-semibold text-dusty-900">{personalInfo.contact.location}</p>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Form */}
                <div className="lg:col-span-7">
                  <div className="p-8 sm:p-10 rounded-3xl bg-white border border-dusty-200 shadow-soft-luxury">
                    <h3 className="text-2xl font-serif font-bold text-dusty-950 mb-4">Kirim Pesan</h3>

                    {formSubmitted && (
                      <div className="mb-6 p-4 rounded-2xl bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs space-y-2">
                        <p className="font-bold">✓ Pesan berhasil disimulasikan terkirim!</p>
                        <p>Anda juga dapat meneruskan pesan ini langsung ke nomor WhatsApp.</p>
                        <button
                          type="button"
                          onClick={handleDirectWhatsApp}
                          className="px-4 py-2 bg-emerald-700 text-white rounded-xl font-bold"
                        >
                          Kirim Langsung via WhatsApp Sekarang
                        </button>
                      </div>
                    )}

                    <form onSubmit={handleFormSubmit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-bold uppercase text-dusty-700 mb-1">Nama Lengkap</label>
                          <input
                            type="text"
                            required
                            value={contactForm.name}
                            onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                            placeholder="Nama Anda"
                            className="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-dusty-200 text-sm focus:outline-none focus:ring-2 focus:ring-dusty-400"
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-bold uppercase text-dusty-700 mb-1">Email</label>
                          <input
                            type="email"
                            required
                            value={contactForm.email}
                            onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                            placeholder="nama@email.com"
                            className="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-dusty-200 text-sm focus:outline-none focus:ring-2 focus:ring-dusty-400"
                          />
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase text-dusty-700 mb-1">Subject</label>
                        <input
                          type="text"
                          required
                          value={contactForm.subject}
                          onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                          placeholder="Perihal Pesan"
                          className="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-dusty-200 text-sm focus:outline-none focus:ring-2 focus:ring-dusty-400"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold uppercase text-dusty-700 mb-1">Pesan (Message)</label>
                        <textarea
                          rows="4"
                          required
                          value={contactForm.message}
                          onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                          placeholder="Tuliskan pesan Anda..."
                          className="w-full px-4 py-2.5 rounded-xl bg-cream-100 border border-dusty-200 text-sm focus:outline-none focus:ring-2 focus:ring-dusty-400 resize-none"
                        ></textarea>
                      </div>

                      <button
                        type="submit"
                        className="w-full py-3.5 rounded-xl bg-dusty-700 hover:bg-dusty-800 text-cream-100 font-bold text-xs uppercase tracking-wider shadow-md transition-colors"
                      >
                        Send Message
                      </button>
                    </form>

                  </div>
                </div>

              </div>

            </div>
          </section>

          {/* 10. FOOTER */}
          <footer className="bg-gradient-to-b from-white to-dusty-100 border-t border-dusty-200 py-12">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">
              
              <div className="flex items-center justify-center space-x-2">
                <div className="w-8 h-8 rounded-full bg-dusty-700 text-cream-100 font-serif font-bold text-sm flex items-center justify-center">
                  P
                </div>
                <span className="font-serif font-bold text-base text-dusty-950">
                  {personalInfo.name}
                </span>
              </div>

              <p className="text-xs text-dusty-700">
                {personalInfo.major} • {personalInfo.faculty} — {personalInfo.university}
              </p>

              <div className="flex justify-center space-x-4 pt-2">
                <a href={personalInfo.contact.instagramLink} target="_blank" rel="noopener noreferrer" className="text-xs text-dusty-700 hover:text-dusty-950">Instagram</a>
                <span>•</span>
                <a href={personalInfo.contact.whatsappLink} target="_blank" rel="noopener noreferrer" className="text-xs text-dusty-700 hover:text-emerald-700">WhatsApp</a>
              </div>

              <div className="pt-4 border-t border-dusty-200">
                <p className="font-serif italic text-sm text-dusty-900">
                  Designed with creativity by <strong>Putri Hayyufi Sa'adah</strong>
                </p>
                <p className="text-[11px] text-dusty-500 mt-1">
                  © 2026 Putri Hayyufi Sa'adah. All rights reserved.
                </p>
              </div>

            </div>
          </footer>

          {/* PROJECT DETAIL MODAL */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="relative w-full max-w-2xl bg-white rounded-3xl p-6 sm:p-8 space-y-4 shadow-2xl">
                <button
                  onClick={() => setSelectedProject(null)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-dusty-100 text-dusty-700 flex items-center justify-center font-bold"
                >
                  ✕
                </button>
                <div className="aspect-video w-full rounded-2xl overflow-hidden bg-dusty-100">
                  <img src={selectedProject.image} alt={selectedProject.title} className="w-full h-full object-cover" />
                </div>
                <span className="px-3 py-1 bg-dusty-100 text-dusty-800 text-xs font-bold rounded-full">{selectedProject.category}</span>
                <h3 className="text-xl font-serif font-bold text-dusty-950">{selectedProject.title}</h3>
                <p className="text-xs sm:text-sm text-dusty-700 leading-relaxed">{selectedProject.description}</p>
                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setSelectedProject(null)}
                    className="px-5 py-2 rounded-full bg-dusty-700 text-cream-100 text-xs font-bold"
                  >
                    Tutup Preview
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SCHOLARSHIP MODAL */}
          {selectedAchievement && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div className="relative w-full max-w-2xl bg-white rounded-3xl p-6 sm:p-8 space-y-4 shadow-2xl">
                <button
                  onClick={() => setSelectedAchievement(null)}
                  className="absolute top-4 right-4 w-8 h-8 rounded-full bg-dusty-100 text-dusty-700 flex items-center justify-center font-bold"
                >
                  ✕
                </button>
                <span className="px-3 py-1 bg-dusty-700 text-cream-100 text-xs font-bold rounded-full">★ {selectedAchievement.badge}</span>
                <h3 className="text-xl font-serif font-bold text-dusty-950">{selectedAchievement.title}</h3>
                <p className="text-xs text-dusty-600 font-semibold">{selectedAchievement.organizer}</p>
                <p className="text-xs sm:text-sm text-dusty-700 leading-relaxed">{selectedAchievement.description}</p>
                <div className="p-4 rounded-xl bg-cream-100 border border-dusty-200 text-xs space-y-1">
                  {selectedAchievement.highlights.map((h, i) => (
                    <p key={i} className="text-dusty-800">✓ {h}</p>
                  ))}
                </div>
                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setSelectedAchievement(null)}
                    className="px-5 py-2 rounded-full bg-dusty-700 text-cream-100 text-xs font-bold"
                  >
                    Tutup
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CV PREVIEW & PRINT MODAL */}
          {isCVModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
              <div className="relative w-full max-w-3xl bg-white rounded-3xl p-6 sm:p-10 space-y-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b pb-4">
                  <div>
                    <h2 className="text-2xl font-serif font-bold text-dusty-950">{personalInfo.name}</h2>
                    <p className="text-xs font-bold text-dusty-600 uppercase tracking-wider">{personalInfo.title} • {personalInfo.scholarship}</p>
                  </div>
                  <div className="flex items-center space-x-2">
                    <button
                      onClick={() => window.print()}
                      className="px-4 py-1.5 bg-dusty-700 text-cream-100 rounded-full text-xs font-bold"
                    >
                      Cetak / PDF
                    </button>
                    <button
                      onClick={() => setIsCVModalOpen(false)}
                      className="w-8 h-8 rounded-full bg-dusty-100 text-dusty-700 font-bold"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                <div className="space-y-4 text-xs sm:text-sm text-dusty-800 leading-relaxed">
                  <div>
                    <h4 className="font-bold text-dusty-950 uppercase text-xs mb-1">Ringkasan Profil</h4>
                    <p>{personalInfo.heroBio}</p>
                  </div>

                  <div>
                    <h4 className="font-bold text-dusty-950 uppercase text-xs mb-1">Riwayat Pendidikan</h4>
                    <p>• <strong>{educationHistory[0].institution}</strong> — {educationHistory[0].major} ({educationHistory[0].status})</p>
                    <p>• <strong>{educationHistory[1].institution}</strong> — {educationHistory[1].status}</p>
                  </div>

                  <div>
                    <h4 className="font-bold text-dusty-950 uppercase text-xs mb-1">Penghargaan</h4>
                    <p>• <strong>Penerima Beasiswa ADik (Afirmasi Pendidikan Tinggi)</strong> Kemendikbudristek RI</p>
                  </div>

                  <div>
                    <h4 className="font-bold text-dusty-950 uppercase text-xs mb-1">Kontak Resmi</h4>
                    <p>WhatsApp: {personalInfo.contact.whatsappDisplay} | Instagram: {personalInfo.contact.instagramHandle}</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* BACK TO TOP BUTTON */}
          {showBackToTop && (
            <button
              onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
              className="fixed bottom-6 right-6 z-40 w-11 h-11 rounded-full bg-dusty-700 text-cream-100 flex items-center justify-center shadow-lg hover:bg-dusty-800 transition-all"
              aria-label="Back to Top"
            >
              ↑
            </button>
          )}

        </div>
      );
    }

    // Render the React Application
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
</body>
</html>
